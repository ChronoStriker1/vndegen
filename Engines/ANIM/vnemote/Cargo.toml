[package]
name = "vnemote"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
eluna = { package = "eluna_rs", path = "../third_party/eluna_rs" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
