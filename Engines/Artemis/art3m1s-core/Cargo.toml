[package]
name = "art3m1s-core"
version = "0.4.0"
license = "MPL-2.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "compatibility_probe"
path = "tools/game-probes/src/bin/compatibility_probe.rs"
required-features = ["game-probes"]

[[bin]]
name = "probe_caption_test"
path = "tools/game-probes/src/bin/probe_caption_test.rs"
required-features = ["game-probes"]

[dependencies]
art3m1s-emote = { path = "crates/art3m1s-emote" }
art3m1s-log = { path = "crates/art3m1s-log" }
art3m1s-render = { path = "crates/art3m1s-render" }
pfs-upk-rust = { path = "crates/pfs-upk-rust" }
# Lua 5.1 on every platform, iOS included: games ship Lua 5.1 bytecode
# (.lub), which Luau can't load. Lua 5.1 is an interpreter, with no JIT.
asb-interpreter = { path = "crates/asb-interpreter", default-features = false, features = ["backend-lua51"] }
art3m1s-media = { path = "crates/art3m1s-media" }
encoding_rs = "0.8"
glam = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# GPU texture asset decoding (PNG only).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 字体光栅化（字形渲染子系统）
ab_glyph = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
art3m1s-render = { path = "crates/art3m1s-render", features = ["metal"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
art3m1s-render = { path = "crates/art3m1s-render", features = ["vulkan"] }

[target.'cfg(any(target_os = "android", target_os = "ios", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
ctt-astcenc = "0.5"

[features]
default = ["gl-backend"]
gl-backend = ["art3m1s-render/gl"]
# Compatibility aliases; native backends are enabled by target dependencies above.
metal-backend = ["runtime-shader", "art3m1s-render/metal"]
vulkan-backend = ["runtime-shader", "art3m1s-render/vulkan"]
runtime-shader = ["art3m1s-render/runtime-shader"]
ffmpeg = ["art3m1s-media/ffmpeg"]
game-probes = ["gl-backend"]

[dev-dependencies]
# 离屏像素回读测试需要在 macOS 上创建一个 CGL headless 上下文。
glow = "0.16"

# Lua 5.1's os.execute calls system(), which iOS doesn't have. This copy of
# lua-src 547.0.0 makes it raise an error there (VNDegen).
[patch.crates-io]
lua-src = { path = "vendor/lua-src" }
