name: VNDegen
options:
  bundleIdPrefix: com.chronostriker1
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  VNDegenKit:
    path: Packages/VNDegenKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VNDegen:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: VNDegenKit
        products: [VNCore, EngineRPGMaker, Metadata, GameInput, Lock, HubUI]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VNDegen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSFaceIDUsageDescription: Unlock hidden games.
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        LSApplicationCategoryType: public.app-category.games
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chronostriker1.vndegen
        PRODUCT_NAME: VNDegen
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
