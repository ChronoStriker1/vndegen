name: VNDegen
options:
  bundleIdPrefix: com.chronostriker1
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  VNDegenKit:
    path: Packages/VNDegenKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.12.0"
    CURRENT_PROJECT_VERSION: "1"
# scripts/kirikiri-engine.sh builds the engine into build/kirikiri, and does nothing when it is up to date. It is a target
# of its own because Xcode copies the app's frameworks before any of the app target's build phases run. It runs with a
# clean environment, because CMake would take the SDK and deployment target Xcode exports for the app.
aggregateTargets:
  # scripts/artemis-engine.sh builds the Artemis engine, art3m1s-core, into build/artemis as a static library, and does
  # nothing when it is up to date. It runs with a clean environment, because Cargo's C builds would take the SDK and
  # deployment target Xcode exports for the app.
  ArtemisEngine:
    buildScripts:
      - name: Build the Artemis engine
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          env -i HOME="$HOME" PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            ${DEVELOPER_DIR:+DEVELOPER_DIR="$DEVELOPER_DIR"} "$SRCROOT/scripts/artemis-engine.sh" "$SRCROOT/build/artemis"
  KiriKiriEngine:
    buildScripts:
      - name: Build the KiriKiri engine
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          env -i HOME="$HOME" PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            ${DEVELOPER_DIR:+DEVELOPER_DIR="$DEVELOPER_DIR"} "$SRCROOT/scripts/kirikiri-engine.sh" "$SRCROOT/build/kirikiri"
targets:
  VNDegen:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        # SVG sources for the app icon. The asset catalog holds the rendered PNGs.
        excludes: ["Icon/**"]
      # The Windows font substitutes and their table, which FontPack and the engines read from Contents/Resources/fonts.
      - path: Engines/Shared/fonts
        type: folder
        buildPhase: resources
      # The General MIDI SoundFont, which engines that play MIDI music read from Contents/Resources/soundfonts.
      - path: Engines/Shared/soundfonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: VNDegenKit
        products: [VNCore, EngineRPGMaker, EngineTyrano, EngineFlash, EngineRenPy, EngineRGSS, EngineKiriKiri, EngineNScripter, EngineWolfRPG, EngineGodot, EngineArtemis, RuntimePackages, FontPack, Metadata, GameInput, Lock, SaveSync, ArchiveImport, HubUI]
      # Ren'Py 8 runs inside the app on iOS, from Ren'Py's static libraries and MetalANGLE, its OpenGL ES on Metal.
      # `scripts/renpy-runtime.sh build/renpy ios` makes both, and scripts/build.sh runs it before an iOS build.
      - framework: build/renpy/ios/RenPyRuntime.xcframework
        embed: false
        platformFilter: iOS
      - framework: build/renpy/ios/MetalANGLE.xcframework
        platformFilter: iOS
      # The Artemis engine, a static library ArtemisEngine below builds first. EngineArtemis finds it at run time, so the
      # linker keeps its API table, which nothing calls by name.
      - target: ArtemisEngine
      - framework: build/artemis/ios/Art3m1s.xcframework
        embed: false
      # The KiriKiri engine, which KiriKiriEngine below builds first. EngineKiriKiri finds it at run time.
      - target: KiriKiriEngine
      - framework: build/kirikiri/ios/KiriKiri.xcframework
        embed: true
    # Ren'Py games on macOS run on the two runtimes this copies into Contents/Resources/RenPy. scripts/renpy-runtime.sh
    # fetches them into build/renpy. They run as helper processes, so each Mach-O file is signed like the app. Any
    # failed step fails the build, and so does a runtime that is missing or unsigned at the end. iOS gets Ren'Py 8's
    # Python side only, since its native side is linked into the app.
    postBuildScripts:
      - name: Bundle Ren'Py runtimes
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/RenPy"
          if [ "$PLATFORM_NAME" != macosx ]; then
            "$SRCROOT/scripts/renpy-runtime.sh" "$SRCROOT/build/renpy" ios
            mkdir -p "$dest"
            rsync -a --delete --exclude .vndegen-runtime --exclude 'lib/py3-mac-universal' "$SRCROOT/build/renpy/8/" "$dest/8/"
            exit 0
          fi
          "$SRCROOT/scripts/renpy-runtime.sh" "$SRCROOT/build/renpy"
          rsync -a --delete --delete-excluded --exclude .vndegen-runtime --exclude ios --exclude licenses "$SRCROOT/build/renpy/" "$dest/"
          binaries=("$dest"/8/lib/py3-mac-universal/{python,librenpython.dylib} "$dest"/7/lib/py2-mac-universal/{python,librenpython.dylib})
          for binary in "${binaries[@]}"; do
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$binary"
          done
          for binary in "${binaries[@]}"; do
            codesign --verify --strict "$binary" || { echo "error: $binary is missing or not signed" >&2; exit 1; }
          done
      # Godot games run on the Godot frameworks, which scripts/godot-engine.sh builds into build/godot and does nothing
      # when they are up to date. They are arm64 only, and EngineGodot opens the one a game needs at run time, so they
      # are copied in rather than linked.
      - name: Bundle the Godot engines
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          env -i HOME="$HOME" PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            ${DEVELOPER_DIR:+DEVELOPER_DIR="$DEVELOPER_DIR"} ${VNDEGEN_GODOT_SLICES:+VNDEGEN_GODOT_SLICES="$VNDEGEN_GODOT_SLICES"} \
            "$SRCROOT/scripts/godot-engine.sh" "$SRCROOT/build/godot"
          case "$PLATFORM_NAME" in
            macosx) slice=macos-arm64 ;;
            iphoneos) slice=ios-arm64 ;;
            iphonesimulator) slice=ios-arm64-simulator ;;
            *) echo "error: no Godot engine for $PLATFORM_NAME" >&2; exit 1 ;;
          esac
          for engine in Godot4 Godot3; do
            source="$SRCROOT/build/godot/$engine.xcframework/$slice/$engine.framework"
            dest="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/$engine.framework"
            [ -d "$source" ] || { echo "error: $source is missing" >&2; exit 1; }
            mkdir -p "$(dirname "$dest")"
            rsync -a --delete "$source/" "$dest/"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$dest"
            codesign --verify --strict "$dest" || { echo "error: $dest is not signed" >&2; exit 1; }
          done
      # Flash games play in Ruffle's web build, which scripts/ruffle-web.sh commits to Engines/Flash/ruffle and
      # scripts/ruffle-runtime.sh checks and stages in build/ruffle. EngineFlash serves it to the game's page.
      - name: Bundle Ruffle
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/ruffle-runtime.sh" "$SRCROOT/build/ruffle"
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Ruffle"
          mkdir -p "$dest"
          rsync -a --delete --exclude licenses --exclude SHA256SUMS "$SRCROOT/build/ruffle/" "$dest/"
      # Settings lists each file in Licenses. Each runtime's script writes its notices to build/<runtime>/licenses, as
      # scripts/licenses/README.md describes.
      - name: Bundle third-party licenses
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses"
          rm -rf "$dest" && mkdir -p "$dest"
          for folder in "$SRCROOT"/build/*/licenses; do
            [ -d "$folder" ] && rsync -a "$folder/" "$dest/"
          done
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VNDegen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Lists VNDegen under Open in and Share for archives, behind the apps that own these types.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, com.rarlab.rar-archive, org.7-zip.7-zip-archive]
        # iOS's built-in type list has no RAR or 7z type. A type another app exports wins over these.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rar]
              public.mime-type: [application/vnd.rar, application/x-rar-compressed]
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeDescription: 7z archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [7z]
              public.mime-type: [application/x-7z-compressed]
        NSFaceIDUsageDescription: Unlock hidden games.
        # Save sync connects to the user's Ludusavi share, usually on the home network.
        NSLocalNetworkUsageDescription: VNDegen connects to your Ludusavi share over SMB to back up and restore game saves.
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        LSApplicationCategoryType: public.app-category.games
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chronostriker1.vndegen
        PRODUCT_NAME: VNDegen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        # The Ren'Py build phases read build/ and write into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The KiriKiri engine's simulator slice is arm64 only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # The macOS app keeps embedded frameworks in Contents/Frameworks, not beside the executable as on iOS.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: ["$(inherited)", "@executable_path/../Frameworks"]
        # What Ren'Py's static libraries need from the system, as in renios's own Xcode project.
        "OTHER_LDFLAGS[sdk=macosx*]": "$(inherited) -lc++ -Wl,-u,_art3m1s_get_api_v1 -framework Metal -framework QuartzCore -framework IOSurface"
        "OTHER_LDFLAGS[sdk=iphone*]": "$(inherited) -lc++ -Wl,-u,_art3m1s_get_api_v1 -framework Metal -framework IOSurface -framework AudioToolbox -framework AVFoundation -framework CoreMotion -framework CoreHaptics -framework GameController -framework ImageIO -framework QuartzCore -framework CoreServices"
