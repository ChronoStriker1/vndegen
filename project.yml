name: VNDegen
options:
  bundleIdPrefix: com.chronostriker1
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  VNDegenKit:
    path: Packages/VNDegenKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
# scripts/kirikiri-engine.sh builds the engine into build/kirikiri, and does nothing when it is up to date. It is a target
# of its own because Xcode copies the app's frameworks before any of the app target's build phases run. It runs with a
# clean environment, because CMake would take the SDK and deployment target Xcode exports for the app.
aggregateTargets:
  KiriKiriEngine:
    buildScripts:
      - name: Build the KiriKiri engine
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          env -i HOME="$HOME" PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            ${DEVELOPER_DIR:+DEVELOPER_DIR="$DEVELOPER_DIR"} "$SRCROOT/scripts/kirikiri-engine.sh" "$SRCROOT/build/kirikiri"
targets:
  VNDegen:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        # SVG sources for the app icon. The asset catalog holds the rendered PNGs.
        excludes: ["Icon/**"]
    dependencies:
      - package: VNDegenKit
        products: [VNCore, EngineRPGMaker, EngineTyrano, EngineRenPy, EngineKiriKiri, Metadata, GameInput, Lock, SaveSync, ArchiveImport, HubUI]
      # The KiriKiri engine, which KiriKiriEngine below builds first. EngineKiriKiri finds it at run time.
      - target: KiriKiriEngine
      - framework: build/kirikiri/ios/KiriKiri.xcframework
        embed: true
    # Ren'Py games on macOS run on the two runtimes this copies into Contents/Resources/RenPy. scripts/renpy-runtime.sh
    # fetches them into build/renpy. They run as helper processes, so each Mach-O file is signed like the app. Any
    # failed step fails the build, and so does a runtime that is missing or unsigned at the end.
    postBuildScripts:
      - name: Bundle Ren'Py runtimes
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          [ "$PLATFORM_NAME" = macosx ] || exit 0
          "$SRCROOT/scripts/renpy-runtime.sh" "$SRCROOT/build/renpy"
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/RenPy"
          rsync -a --delete --exclude .vndegen-runtime "$SRCROOT/build/renpy/" "$dest/"
          binaries=("$dest"/8/lib/py3-mac-universal/{python,librenpython.dylib} "$dest"/7/lib/py2-mac-universal/{python,librenpython.dylib})
          for binary in "${binaries[@]}"; do
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$binary"
          done
          for binary in "${binaries[@]}"; do
            codesign --verify --strict "$binary" || { echo "error: $binary is missing or not signed" >&2; exit 1; }
          done
      # Settings lists each file in Licenses. The KiriKiri engine build collects its own and its dependencies'.
      - name: Bundle third-party licenses
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          rsync -a --delete "$SRCROOT/build/kirikiri/licenses/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses/"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VNDegen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Lists VNDegen under Open in and Share for archives, behind the apps that own these types.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, com.rarlab.rar-archive, org.7-zip.7-zip-archive]
        # iOS's built-in type list has no RAR or 7z type. A type another app exports wins over these.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rar]
              public.mime-type: [application/vnd.rar, application/x-rar-compressed]
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeDescription: 7z archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [7z]
              public.mime-type: [application/x-7z-compressed]
        NSFaceIDUsageDescription: Unlock hidden games.
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        LSApplicationCategoryType: public.app-category.games
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chronostriker1.vndegen
        PRODUCT_NAME: VNDegen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        # The Ren'Py build phase reads build/renpy and writes into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The KiriKiri engine's simulator slice is arm64 only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # The macOS app keeps embedded frameworks in Contents/Frameworks, not beside the executable as on iOS.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: ["$(inherited)", "@executable_path/../Frameworks"]
